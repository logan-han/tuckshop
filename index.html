  <body>
    <noscript>
      <div class="no-js">
        <h1>The same lunch, every Thursday, for the whole term</h1>
        <p>
          Tuckshop places recurring school lunch orders through your own Flexischools account. Pick
          the days of the week and the term dates, pick anything from the canteen menu, and every
          date is checked for closures, cut-offs, sold-out items and lunches you already ordered
          before the whole lot goes in at once. Orders can be cancelled here too, refunded to the
